<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Daniel Atencia Pahuana | Estudiante de Ingeniería de Sistemas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(99, 102, 241, 0.4);
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* Ambient glowing background orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 0;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%);
            top: 15%;
            left: 20%;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35), transparent 70%);
            bottom: 15%;
            right: 20%;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, 20px) scale(1.08);
            }
        }

        /* Profile Card */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 48px;
            border-radius: 24px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 20px 50px -10px rgba(0, 0, 0, 0.6),
                0 0 80px -20px rgba(99, 102, 241, 0.15);
            text-align: center;
            max-width: 580px;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--card-border-hover);
            box-shadow: 
                0 0 0 1px rgba(99, 102, 241, 0.2),
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 0 100px -15px rgba(99, 102, 241, 0.3);
        }

        /* Avatar Monogram */
        .avatar {
            width: 92px;
            height: 92px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1, #a855f7);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .avatar {
            transform: scale(1.06) rotate(3deg);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Title / Name */
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 16px;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 40%, #e2e8f0 70%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Badge / Role */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.22);
            color: #7dd3fc;
            padding: 8px 20px;
            border-radius: 9999px;
            box-shadow: 0 2px 12px rgba(56, 189, 248, 0.1);
            transition: all 0.3s ease;
        }

        .badge:hover {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.4);
            transform: scale(1.02);
        }

        .badge h2 {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: inherit;
            display: inline;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            right: 24px;
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .footer-dot {
            width: 6px;
            height: 6px;
            background-color: #6366f1;
            border-radius: 50%;
        }

        @media (max-width: 640px) {
            .card {
                padding: 36px 24px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .badge h2 {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <main class="card">
        <div class="avatar" aria-hidden="true">
            <div class="avatar-inner">JD</div>
        </div>
        <h1>Juan Daniel Atencia Pahuana</h1>
        <div class="badge">
            <span class="pulse-dot"></span>
            <h2>Estudiante de Ingeniería de Sistemas</h2>
        </div>
    </main>

    <footer class="footer">
        <span class="footer-dot"></span>
        <span>Sesión de Vibe Coding</span>
    </footer>
</body>

</html>
