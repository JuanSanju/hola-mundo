<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan Daniel Atencia Pahuana | Estudiante de Ingeniería de Sistemas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(99, 102, 241, 0.4);
            --accent-blue: #38bdf8;
            --accent-purple: #a855f7;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 48px 20px 32px 20px;
            gap: 32px;
        }

        /* Ambient glowing background orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 0;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45), transparent 70%);
            top: 15%;
            left: 20%;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.35), transparent 70%);
            bottom: 15%;
            right: 20%;
            animation: float 12s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, 20px) scale(1.08);
            }
        }

        /* Profile Card */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 48px;
            border-radius: 24px;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 20px 50px -10px rgba(0, 0, 0, 0.6),
                0 0 80px -20px rgba(99, 102, 241, 0.15);
            text-align: center;
            max-width: 580px;
            width: 90%;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--card-border-hover);
            box-shadow: 
                0 0 0 1px rgba(99, 102, 241, 0.2),
                0 30px 60px -12px rgba(0, 0, 0, 0.7),
                0 0 100px -15px rgba(99, 102, 241, 0.3);
        }

        /* Avatar Monogram */
        .avatar {
            width: 92px;
            height: 92px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1, #a855f7);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .avatar {
            transform: scale(1.06) rotate(3deg);
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0f172a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Title / Name */
        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 16px;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 40%, #e2e8f0 70%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Badge / Role */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.22);
            color: #7dd3fc;
            padding: 8px 20px;
            border-radius: 9999px;
            box-shadow: 0 2px 12px rgba(56, 189, 248, 0.1);
            transition: all 0.3s ease;
        }

        .badge:hover {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.4);
            transform: scale(1.02);
        }

        .badge h2 {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: inherit;
            display: inline;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
        }

        /* Contact Section */
        .contact-card {
            text-align: left;
            padding: 44px 44px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .contact-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px auto;
            border-radius: 16px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
        }

        .section-header h2 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, #e2e8f0 70%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #e2e8f0;
            letter-spacing: 0.01em;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #64748b;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent-indigo);
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1, #a855f7);
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.45);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            margin-top: 6px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -6px rgba(99, 102, 241, 0.6);
            filter: brightness(1.08);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            filter: grayscale(0.2);
        }

        /* Spinner inside button */
        .btn-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-submit.loading .btn-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status message */
        .form-status {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .form-status.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
        }

        .form-status.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            position: relative;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 500;
            letter-spacing: 0.01em;
            z-index: 1;
        }

        .footer-dot {
            width: 6px;
            height: 6px;
            background-color: #6366f1;
            border-radius: 50%;
        }

        @media (max-width: 640px) {
            body {
                padding: 28px 16px;
                gap: 24px;
            }
            .card {
                padding: 36px 20px;
            }
            .contact-card {
                padding: 32px 20px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .badge h2 {
                font-size: 0.85rem;
            }
            .section-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <main class="card">
        <div class="avatar" aria-hidden="true">
            <div class="avatar-inner">JD</div>
        </div>
        <h1>Juan Daniel Atencia Pahuana</h1>
        <div class="badge">
            <span class="pulse-dot"></span>
            <h2>Estudiante de Ingeniería de Sistemas</h2>
        </div>
    </main>

    <!-- Sección de Contacto -->
    <section class="card contact-card" id="contacto">
        <div class="section-header">
            <div class="contact-icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            </div>
            <h2>Contacto</h2>
            <p>¿Tienes alguna consulta o propuesta? Envíame un mensaje.</p>
        </div>

        <form id="contact-form" class="contact-form" novalidate>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="tu.correo@ejemplo.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            </div>

            <button type="submit" id="btn-enviar" class="btn-submit">
                <span class="btn-text">Enviar</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <div id="form-status" class="form-status" role="status" aria-live="polite"></div>
        </form>
    </section>

    <footer class="footer">
        <span class="footer-dot"></span>
        <span>Sesión de Vibe Coding</span>
    </footer>

    <script type="module" src="app.js"></script>
</body>

</html>
